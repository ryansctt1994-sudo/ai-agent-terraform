name: Offline Terraform Plan Policy Fixtures

on:
  pull_request:
    paths:
      - 'scripts/check_plan_policy.py'
      - 'tests/test_plan_policy.py'
      - 'tests/terraform-fixture/**'
      - '.github/workflows/plan-policy-fixtures.yml'
      - 'accounts/**/*.tf'
      - 'environments/**/*.tf'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - name: Terraform binary version and offline core fixture formatting
        run: |
          terraform version
          terraform fmt -check -diff tests/terraform-fixture
      - name: Terraform core-only init and validate (no remote backend or cloud provider)
        working-directory: tests/terraform-fixture
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color
      - name: Produce actual Terraform plan JSON from isolated fixture
        working-directory: tests/terraform-fixture
        run: |
          terraform plan -input=false -lock=false -out=tfplan -no-color
          terraform show -json tfplan > tfplan.json
          python ../../scripts/check_plan_policy.py tfplan.json
      - name: Run no-cloud/no-provider plan policy regression fixtures
        run: python -m unittest discover -s tests -p 'test_plan_policy.py' -v
